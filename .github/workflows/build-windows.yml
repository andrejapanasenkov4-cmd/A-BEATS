name: Build A-BEATS for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force app, assets, tests | Out-Null
          foreach ($name in @('__init__.py','core.py','itunes_discography.py','main.py','quota.py','token_store.py','youtube_api.py')) {
            if (-not (Test-Path $name)) { throw "Missing required source file: $name" }
            Copy-Item $name app/
          }
          foreach ($name in @('a_beats.ico','a_beats_16.png','a_beats_32.png','a_beats_48.png','a_beats_64.png','a_beats_128.png','a_beats_256.png')) {
            if (Test-Path $name) { Copy-Item $name assets/ }
          }
          foreach ($name in @('test_core.py','test_render_integration.py','test_token_store.py')) {
            if (-not (Test-Path $name)) { throw "Missing test file: $name" }
            Copy-Item $name tests/
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Download FFmpeg runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip -TimeoutSec 180
              if ((Get-Item $zip).Length -gt 1000000) { $downloaded = $true; break }
              throw 'Downloaded FFmpeg archive is unexpectedly small.'
            } catch {
              Write-Warning "FFmpeg download attempt $attempt failed: $_"
              if ($attempt -lt 5) { Start-Sleep -Seconds (10 * $attempt) }
            }
          }
          if (-not $downloaded) {
            throw 'Could not download FFmpeg after 5 attempts. The upstream host may be temporarily unavailable; rerun the workflow.'
          }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found in FFmpeg archive.' }
          New-Item -ItemType Directory -Force -Path 'runtime\ffmpeg\bin' | Out-Null
          Copy-Item $ffmpeg.FullName 'runtime\ffmpeg\bin\ffmpeg.exe'
          if ($ffprobe) { Copy-Item $ffprobe.FullName 'runtime\ffmpeg\bin\ffprobe.exe' }

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Pytest suite failed.' }

      - name: Build desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name A-BEATS --icon assets\a_beats.ico --add-data "assets;assets" --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all google.auth --collect-all tzdata --collect-all PIL --hidden-import google.auth.transport.requests --hidden-import google_auth_oauthlib.flow app\main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed.' }
          New-Item -ItemType Directory -Force -Path 'dist\A-BEATS\ffmpeg\bin' | Out-Null
          Copy-Item 'runtime\ffmpeg\bin\*' 'dist\A-BEATS\ffmpeg\bin\' -Force
          Copy-Item README.md,PRIVACY.md,VERSION,CHANGELOG.md,THIRD_PARTY_NOTICES.md 'dist\A-BEATS\'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc BUILD_INSTALLER.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed.' }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: A-BEATS-Windows-x64
          path: |
            dist/A-BEATS/**
            installer_output/*.exe
          if-no-files-found: error
          retention-days: 30
