name: Build A-BEATS for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check source tree
        shell: pwsh
        run: |
          $required = @('app/main.py','requirements.txt','BUILD_INSTALLER.iss','tests')
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Missing source path: $p. Upload the contents of the A-BEATS source ZIP to the repository root first." }
          }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive $zip $dst -Force
          $ffmpeg = Get-ChildItem $dst -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $dst -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe missing' }
          New-Item -ItemType Directory -Force runtime/ffmpeg/bin | Out-Null
          Copy-Item $ffmpeg.FullName runtime/ffmpeg/bin/ffmpeg.exe
          if ($ffprobe) { Copy-Item $ffprobe.FullName runtime/ffmpeg/bin/ffprobe.exe }
      - name: Run tests
        run: |
          python -m pytest -q
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name A-BEATS --icon assets/a_beats.ico --add-data "assets;assets" --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all google.auth --collect-all tzdata --collect-all PIL --hidden-import google.auth.transport.requests --hidden-import google_auth_oauthlib.flow --hidden-import core --hidden-import quota --hidden-import youtube_api --hidden-import itunes_discography --hidden-import token_store app/main.py
          New-Item -ItemType Directory -Force dist/A-BEATS/ffmpeg/bin | Out-Null
          Copy-Item runtime/ffmpeg/bin/* dist/A-BEATS/ffmpeg/bin/ -Force
          Copy-Item README.md,PRIVACY.md,VERSION,CHANGELOG.md,THIRD_PARTY_NOTICES.md dist/A-BEATS/
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' BUILD_INSTALLER.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: A-BEATS-Windows-x64
          path: |
            dist/A-BEATS/**
            installer_output/*.exe
          if-no-files-found: error
          retention-days: 30
