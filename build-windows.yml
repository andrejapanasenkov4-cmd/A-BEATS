name: Build A-BEATS for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Download FFmpeg runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -UseBasicParsing 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found in FFmpeg archive.' }
          New-Item -ItemType Directory -Force -Path 'runtime\ffmpeg\bin' | Out-Null
          Copy-Item $ffmpeg.FullName 'runtime\ffmpeg\bin\ffmpeg.exe'
          if ($ffprobe) { Copy-Item $ffprobe.FullName 'runtime\ffmpeg\bin\ffprobe.exe' }

      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Pytest suite failed.' }

      - name: Build desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name A-BEATS --icon assets\a_beats.ico --add-data "assets;assets" --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all google.auth --collect-all tzdata --collect-all PIL --hidden-import google.auth.transport.requests --hidden-import google_auth_oauthlib.flow --hidden-import core --hidden-import quota --hidden-import youtube_api --hidden-import itunes_discography --hidden-import token_store app\main.py
          New-Item -ItemType Directory -Force -Path 'dist\A-BEATS\ffmpeg\bin' | Out-Null
          Copy-Item 'runtime\ffmpeg\bin\*' 'dist\A-BEATS\ffmpeg\bin\' -Force
          Copy-Item README.md,PRIVACY.md,VERSION,CHANGELOG.md,THIRD_PARTY_NOTICES.md 'dist\A-BEATS\'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc BUILD_INSTALLER.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed.' }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: A-BEATS-Windows-x64
          path: |
            dist/A-BEATS/**
            installer_output/*.exe
          if-no-files-found: error
          retention-days: 30
